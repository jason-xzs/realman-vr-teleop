services:
  teleop:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: realman_vr_teleop
    network_mode: host
    privileged: true
    volumes:
      - ..:/workspace
      - /dev:/dev
    environment:
      ADB_SERVER_SOCKET: tcp:127.0.0.1:5037
    stdin_open: true
    tty: true
